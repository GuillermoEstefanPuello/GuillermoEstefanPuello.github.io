name: Actualizar contribuciones

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días, 6:17 a. m. hora de RD
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write
  pages: write

concurrency:
  group: contribuciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer contribuciones y actualizar index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_contribs.py

      - name: Commit y push si cambió
        id: commit
        run: |
          if git diff --quiet; then
            echo "Sin cambios que subir."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: contador de contribuciones automatico"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Pedir redeploy de GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
